<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Live</title>
  <!-- Script Ufficiale SDK Telegram per le Web App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #222222);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 20px;
      color: var(--tg-theme-hint-color, #888888);
    }

    .countdown-container {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 340px;
      padding: 0 16px;
      box-sizing: border-box;
    }

    .time-box {
      background: var(--tg-theme-secondary-bg-color, #f0f0f0);
      padding: 16px 12px;
      border-radius: 12px;
      flex: 1; /* Fa in modo che i 3 box si dividano lo spazio in parti uguali */
    }

    .number {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--tg-theme-button-color, #2481cc);
    }

    .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <h1>⏳ Tempo Rimanente</h1>

  <div class="countdown-container">
    <div class="time-box"><div id="days" class="number">00</div><div class="label">Giorni</div></div>
    <div class="time-box"><div id="hours" class="number">00</div><div class="label">Ore</div></div>
    <div class="time-box"><div id="minutes" class="number">00</div><div class="label">Minuti</div></div>
  </div>

  <script>
    // Inizializza l'interfaccia Telegram
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand(); // Espande la finestra a schermo intero

    // impostazione Data Target (Anno, Mese, Giorno, Ora, Minuti)
    const targetDate = new Date("2026-11-13T19:30:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference <= 0) {
        document.body.innerHTML = "<h2>🎉 Il momento è arrivato!</h2>";
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));

      document.getElementById("days").innerText = String(days).padStart(2, '0');
      document.getElementById("hours").innerText = String(hours).padStart(2, '0');
      document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
    }

    // Aggiornamento ogni minuto (visto che i secondi non ci sono più)
    setInterval(updateCountdown, 60000);
    updateCountdown();
  </script>
</body>
</html>
